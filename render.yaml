# Render Blueprint: бесплатный веб-сервис из Dockerfile.
# База — внешняя (Neon), потому что бесплатный Postgres самого Render
# удаляется через 30 дней после создания.
#
# При первом деплое Render спросит только три значения (sync: false):
#   DATABASE_URL — строка подключения Neon (?sslmode=require)
#   BOT_TOKEN    — токен бота от @BotFather
#   ADMIN_IDS    — telegram_id админов через запятую
# Остальное подставляется автоматически.
services:
  - type: web
    name: flowix
    runtime: docker
    plan: free
    region: frankfurt # ближе к России, чем Орегон
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true # Render сгенерирует случайную строку сам
      # Фото товаров — в БД: у бесплатного тарифа нет постоянного диска.
      - key: UPLOAD_STORE
        value: db
      # Бот на webhook: сервис засыпает без трафика, апдейт от Telegram его будит.
      - key: BOT_MODE
        value: webhook
      # Адрес сервиса подставляется автоматически (схему https:// код добавит сам):
      # PUBLIC_URL — для webhook, TELEGRAM_APP_URL — для кнопки «Открыть магазин».
      - key: PUBLIC_URL
        fromService:
          type: web
          name: flowix
          property: host
      - key: TELEGRAM_APP_URL
        fromService:
          type: web
          name: flowix
          property: host
