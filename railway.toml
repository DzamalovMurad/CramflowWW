# Единственный конфиг деплоя. Сервис живёт только на Railway:
# блюпринтов других хостингов в репозитории нет и быть не должно —
# два описания одного деплоя всегда расходятся.

[build]
# Собираем из Dockerfile, а не Nixpacks: образу нужен pg_dump для ночных
# бэкапов (/backup и BACKUP_CRON), и ставит его именно Dockerfile.
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Схема БД приводится в порядок самим бинарником при старте (goose, migrate.Up),
# поэтому отдельного release-шага нет — команда просто запускает сервис.
startCommand = "./cramflow"

# /healthz — глубокая проба: пингует Postgres, спрашивает у Telegram getMe
# и отдаёт версию схемы. Она вне лимитера, иначе проба блокировала бы сама себя.
# Лёгкий /api/health (без БД) остаётся для внешних пингов.
healthcheckPath = "/healthz"
healthcheckTimeout = 30

# Падение процесса — это баг, а не штатный сценарий: перезапускаем, но
# ограниченное число раз, чтобы упавший деплой не крутился в цикле молча.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Один инстанс — сознательно. Планировщик уведомлений, крон бэкапов и очередь
# рассылок живут в процессе и рассчитаны на единственного исполнителя:
# на двух репликах клиент получил бы два «Как вам букет?» на один заказ.
numReplicas = 1
