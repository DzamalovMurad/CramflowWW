# Пинг витрины, чтобы бесплатный инстанс Render не засыпал:
# без входящего трафика он останавливается через 15 минут, и первый клиент
# ждал бы ~минуту на холодном старте. 750 бесплатных часов в месяц покрывают
# круглосуточную работу (~730 ч).
#
# Нужен секрет репозитория PUBLIC_URL, например https://flowix.onrender.com
# Временное решение на период жизни на Render — после возврата на Railway
# workflow можно отключить (Actions → Keepalive → Disable workflow).
name: Keepalive

on:
  schedule:
    - cron: '*/10 * * * *' # каждые 10 минут (GitHub может задерживать на 5–15 мин)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "Секрет PUBLIC_URL не задан — пропускаю"; exit 0
          fi
          # Health-эндпоинт не трогает БД: Neon продолжает спать и не жжёт CU-часы.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$PUBLIC_URL/api/health")
          echo "health=$code"
          [ "$code" = "200" ]
